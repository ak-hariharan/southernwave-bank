info:
  app:
    name: API Gateway
    description: This service acts as the unified entry point to route requests to microservices securely.

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: user-service
        url: http://localhost:8765/swagger/user-service
      - name: account-service
        url: http://localhost:8765/swagger/account-service
      - name: transaction-service
        url: http://localhost:8765/swagger/transaction-service
      - name: auth-service
        url: http://localhost:8765/swagger/auth-service

