<div class="modal-overlay" *ngIf="isVisible" (click)="onOverlayClick($event)" role="dialog" aria-modal="true"
  aria-labelledby="login-title">

  <div class="modal-card">

    <!-- Close Button -->
    <button class="modal-close" (click)="closeModal()" aria-label="Close login modal">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="18" y1="6" x2="6" y2="18" />
        <line x1="6" y1="6" x2="18" y2="18" />
      </svg>
    </button>

    <!-- Header -->
    <div class="modal-header">
      <div class="modal-logo">🏦</div>
      <h2 id="login-title" class="modal-title">Welcome Back</h2>
      <p class="modal-subtitle">Sign in to SouthernWave Bank</p>
    </div>

    <!-- Login Form -->
    <form [formGroup]="loginForm" (ngSubmit)="onLoginSubmit()" novalidate class="login-form">

      <!-- Email Field -->
      <div class="form-group" [class.has-error]="emailCtrl.invalid && emailCtrl.touched">
        <label class="form-label" for="emailId">Email Address</label>
        <div class="input-wrapper">
          <span class="input-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
              <polyline points="22,6 12,13 2,6" />
            </svg>
          </span>
          <input id="emailId" type="email" class="form-input" formControlName="emailId"
            placeholder="officer@southernwavebank.com" autocomplete="email" />
        </div>
        <span class="error-msg" *ngIf="emailCtrl.touched && emailCtrl.hasError('required')">
          Email is required.
        </span>
        <span class="error-msg" *ngIf="emailCtrl.touched && emailCtrl.hasError('email')">
          Please enter a valid email address.
        </span>
      </div>

      <!-- Password Field -->
      <div class="form-group" [class.has-error]="passwordCtrl.invalid && passwordCtrl.touched">
        <label class="form-label" for="password">Password</label>
        <div class="input-wrapper">
          <span class="input-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
              <path d="M7 11V7a5 5 0 0 1 10 0v4" />
            </svg>
          </span>
          <input id="password" [type]="showPassword ? 'text' : 'password'" class="form-input" formControlName="password"
            placeholder="Enter your password" autocomplete="current-password" />
          <button type="button" class="toggle-password" (click)="togglePasswordVisibility()"
            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
            <svg *ngIf="!showPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
            <svg *ngIf="showPassword" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path
                d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
              <line x1="1" y1="1" x2="23" y2="23" />
            </svg>
          </button>
        </div>
        <span class="error-msg" *ngIf="passwordCtrl.touched && passwordCtrl.hasError('required')">
          Password is required.
        </span>
        <span class="error-msg" *ngIf="passwordCtrl.touched && passwordCtrl.hasError('minlength')">
          Password must be at least 6 characters.
        </span>
      </div>

      <!-- Server Error -->
      <div class="server-error" *ngIf="errorMessage" role="alert">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10" />
          <line x1="12" y1="8" x2="12" y2="12" />
          <line x1="12" y1="16" x2="12.01" y2="16" />
        </svg>
        {{ errorMessage }}
      </div>

      <!-- Submit Button -->
      <button type="submit" class="submit-btn" [disabled]="isLoading" id="login-submit-btn">
        <span *ngIf="!isLoading">Sign In</span>
        <span *ngIf="isLoading" class="spinner-wrapper">
          <span class="spinner"></span>
          Signing in...
        </span>
      </button>

    </form>

    <!-- Footer Links -->
    <div class="modal-footer">
      <a href="#" class="footer-link" (click)="$event.preventDefault()">Forgot Password?</a>
    </div>

  </div>
</div>
