<div class="register-page">
    <div class="register-card">

        <div class="register-header">
            <div class="register-logo" (click)="goToHome()">🏦</div>
            <h2 class="register-title">Officer Registration</h2>
            <p class="register-subtitle">Create a new internal officer account</p>
        </div>

        <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" novalidate class="register-form">

            <div class="form-row">
                <!-- First Name -->
                <div class="form-group"
                    [class.has-error]="registerForm.get('firstName')?.invalid && registerForm.get('firstName')?.touched">
                    <label class="form-label" for="firstName">First Name</label>
                    <input id="firstName" type="text" class="form-input" formControlName="firstName"
                        placeholder="John" />
                </div>

                <!-- Last Name -->
                <div class="form-group"
                    [class.has-error]="registerForm.get('lastName')?.invalid && registerForm.get('lastName')?.touched">
                    <label class="form-label" for="lastName">Last Name</label>
                    <input id="lastName" type="text" class="form-input" formControlName="lastName"
                        placeholder="Smith" />
                </div>
            </div>

            <!-- Email Field -->
            <div class="form-group"
                [class.has-error]="registerForm.get('emailId')?.invalid && registerForm.get('emailId')?.touched">
                <label class="form-label" for="emailId">Email Address</label>
                <input id="emailId" type="email" class="form-input" formControlName="emailId"
                    placeholder="officer@southernwavebank.com" autocomplete="email" />
                <span class="error-msg"
                    *ngIf="registerForm.get('emailId')?.touched && registerForm.get('emailId')?.hasError('email')">
                    Please enter a valid email address.
                </span>
            </div>

            <!-- Contact Number -->
            <div class="form-group"
                [class.has-error]="registerForm.get('contactNumber')?.invalid && registerForm.get('contactNumber')?.touched">
                <label class="form-label" for="contactNumber">Contact Number</label>
                <input id="contactNumber" type="tel" class="form-input" formControlName="contactNumber"
                    placeholder="1234567890" maxlength="10" />
                <span class="error-msg"
                    *ngIf="registerForm.get('contactNumber')?.touched && registerForm.get('contactNumber')?.hasError('pattern')">
                    Must be exactly 10 digits.
                </span>
            </div>



            <!-- Alerts -->
            <div class="server-error" *ngIf="errorMessage">
                {{ errorMessage }}
            </div>
            <div class="server-success" *ngIf="successMessage">
                {{ successMessage }}
            </div>

            <!-- Submit Button -->
            <button type="submit" class="submit-btn" [disabled]="isLoading">
                <span *ngIf="!isLoading">Register Officer</span>
                <span *ngIf="isLoading" class="spinner-wrapper"><span class="spinner"></span> Registering...</span>
            </button>

        </form>

        <div class="register-footer">
            <a href="javascript:void(0)" (click)="goToHome()" class="footer-link">Back to Home</a>
        </div>

    </div>
</div>
